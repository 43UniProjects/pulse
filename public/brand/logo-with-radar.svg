<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="dropGrad" cx="36%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ff5a55"/><stop offset="28%" stop-color="#d2121c"/>
      <stop offset="62%" stop-color="#9c0711"/><stop offset="100%" stop-color="#520310"/>
    </radialGradient>
    <radialGradient id="groundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff3b3b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="rimBlur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="edgeSoft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="hiSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <radialGradient id="beamRad" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="300">
      <stop offset="0" stop-color="#e0313a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e0313a" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- GROUND LAYER: faint rings + shockwaves -->
  <ellipse cx="400" cy="550" rx="60" ry="20.0" fill="none" stroke="#e68a8a" stroke-width="1" opacity="0.35"/><ellipse cx="400" cy="550" rx="120" ry="40.0" fill="none" stroke="#e68a8a" stroke-width="1" opacity="0.35"/><ellipse cx="400" cy="550" rx="180" ry="60.0" fill="none" stroke="#e68a8a" stroke-width="1" opacity="0.35"/><ellipse cx="400" cy="550" rx="240" ry="80.0" fill="none" stroke="#e68a8a" stroke-width="1" opacity="0.35"/><ellipse cx="400" cy="550" rx="300" ry="100.0" fill="none" stroke="#e68a8a" stroke-width="1" opacity="0.35"/>
  <ellipse cx="400" cy="550" rx="300" ry="100.0" fill="url(#groundGlow)">
    <animate attributeName="opacity" values="1;0.55;1" dur="2.0s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="400" cy="550" rx="20" ry="6.7" fill="none" stroke="#d93636" stroke-width="1.6" opacity="0"><animate attributeName="rx" values="20;330" dur="4.0s" begin="-4.0s" repeatCount="indefinite"/><animate attributeName="ry" values="6.7;110.0" dur="4.0s" begin="-4.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="4.0s" begin="-4.0s" repeatCount="indefinite"/></ellipse><ellipse cx="400" cy="550" rx="20" ry="6.7" fill="none" stroke="#d93636" stroke-width="1.6" opacity="0"><animate attributeName="rx" values="20;330" dur="4.0s" begin="-2.0s" repeatCount="indefinite"/><animate attributeName="ry" values="6.7;110.0" dur="4.0s" begin="-2.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="4.0s" begin="-2.0s" repeatCount="indefinite"/></ellipse>

  <!-- RADAR BEAM rotating clockwise around the drop -->
  <g id="radar-beam" transform="translate(400 550) scale(1 0.3333)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.0s" repeatCount="indefinite"/>
      <path d="M0 0 L300.0 0.0 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L299.7 13.1 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L298.9 26.1 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L297.4 39.2 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L295.4 52.1 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L292.9 64.9 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L289.8 77.6 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L286.1 90.2 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L281.9 102.6 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L277.2 114.8 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L271.9 126.8 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L266.1 138.5 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L259.8 150.0 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L253.0 161.2 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L245.7 172.1 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L238.0 182.6 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L229.8 192.8 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L221.2 202.7 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L212.1 212.1 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L202.7 221.2 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L192.8 229.8 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L182.6 238.0 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L172.1 245.7 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/><path d="M0 0 L161.2 253.0 A300 300 0 0 1 150.0 259.8 Z" fill="url(#beamRad)" opacity="0.05"/>
      <line x1="0" y1="0" x2="150.0" y2="259.8" stroke="#d62020" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>

  <!-- BLIPS -->
  <g id="blips"><ellipse cx="607.8" cy="590.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-0.33s" repeatCount="indefinite"/></ellipse><ellipse cx="244.2" cy="580.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-3.00s" repeatCount="indefinite"/></ellipse><ellipse cx="400.0" cy="510.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-1.67s" repeatCount="indefinite"/></ellipse><ellipse cx="192.2" cy="510.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-2.33s" repeatCount="indefinite"/></ellipse><ellipse cx="400.0" cy="630.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-3.67s" repeatCount="indefinite"/></ellipse><ellipse cx="451.9" cy="540.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-1.00s" repeatCount="indefinite"/></ellipse><ellipse cx="555.8" cy="580.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-0.33s" repeatCount="indefinite"/></ellipse><ellipse cx="503.9" cy="490.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-1.33s" repeatCount="indefinite"/></ellipse><ellipse cx="320.0" cy="560.0" rx="12" ry="4" fill="#b81818" opacity="0.15"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.55;1" dur="4.0s" begin="-2.90s" repeatCount="indefinite"/></ellipse></g>

  <!-- DROP SHADOW -->
  <ellipse cx="400" cy="550" rx="90" ry="30" fill="rgba(80,0,0,0.45)" filter="url(#shadowBlur)">
    <animate attributeName="rx" values="90;70;90" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="30;23;30" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- BLOOD DROP (floating) -->
  <g id="blood-drop">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/>
    <path d="M 406 104 C 432 222 550 290 550 400 A 150 150 0 0 1 250 400 C 250 290 368 222 394 104 Q 400 86 406 104 Z" fill="url(#dropGrad)"/>
    <path d="M 400 120 C 375 230 270 310 270 400 A 130 130 0 0 0 310 490 A 110 110 0 0 1 285 400 C 285 310 385 230 400 120 Z" fill="rgba(255,255,255,0.42)" filter="url(#hiSoft)"/>
    <path d="M 500 490 A 130 130 0 0 0 545 400 C 545 440 510 480 470 500 Z" fill="rgba(255,110,110,0.55)" filter="url(#rimBlur)"/>
  </g>
</svg>
