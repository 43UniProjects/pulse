<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>

    <!-- Radar Base Surface Gradient -->
    <radialGradient id="radarDiskGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#ffe6e6" />
    </radialGradient>

    <!-- Blood Drop Base 3D Shading -->
    <radialGradient id="dropGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="35%" stop-color="#b30000" />
      <stop offset="75%" stop-color="#4d0000" />
      <stop offset="100%" stop-color="#1a0000" />
    </radialGradient>

    <!-- Sweep Fill Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(217, 54, 54, 0.15)" />
      <stop offset="100%" stop-color="rgba(217, 54, 54, 0.4)" />
    </linearGradient>

    <!-- Filters for Shadows & Glows -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="rimBlur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <style>
    /* 
      To animate the radar sweep, uncomment the CSS below:
      
      @keyframes scan {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #animatable-sweep {
        animation: scan 4s linear infinite;
      }
    */
  </style>

  
  

  <!-- RADAR GRID (Built flat, scaled into isometric perspective) -->
  <g id="radar-container" transform="translate(400, 550) scale(1, 0.3333)">
    
    <!-- 3D Lower Edge (Offset Y by 20px in pre-scale coordinate space) -->
    <circle cx="0" cy="24" r="300" fill="none" stroke="#8c1111" stroke-width="12" vector-effect="non-scaling-stroke" />

    <!-- Radar Disk Surface -->
    <circle cx="0" cy="0" r="300" fill="url(#radarDiskGrad)" stroke="#c32626" stroke-width="5" vector-effect="non-scaling-stroke" />

    <!-- Concentric Inner Rings -->
    <circle cx="0" cy="0" r="240" fill="none" stroke="#e68a8a" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="#e68a8a" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#e68a8a" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#e68a8a" stroke-width="1.5" vector-effect="non-scaling-stroke" />

    <!-- Radial Sector Lines (12 sectors, 30 degrees apart) -->
    <g id="radial-lines" stroke="#e68a8a" stroke-width="1.5" vector-effect="non-scaling-stroke">
      <line x1="-300" y1="0" x2="300" y2="0" />
      <line x1="-259.8" y1="-150" x2="259.8" y2="150" />
      <line x1="-150" y1="-259.8" x2="150" y2="259.8" />
      <line x1="0" y1="-300" x2="0" y2="300" />
      <line x1="150" y1="-259.8" x2="-150" y2="259.8" />
      <line x1="259.8" y1="-150" x2="-259.8" y2="150" />
    </g>

    <!-- Radar Sweep Node (Animatable via CSS rotation) -->
    <g id="animatable-sweep">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4.0s" repeatCount="indefinite"/>
      <!-- 60-degree wedge -->
      <path d="M 0 0 L 300 0 A 300 300 0 0 1 150 259.8 Z" fill="url(#sweepGrad)" />
      <!-- Leading Edge -->
      <line x1="0" y1="0" x2="150" y2="259.8" stroke="#d93636" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    </g>

    <!-- Radar Points/Dots -->
    <g id="radar-dots" fill="#991414">
      <circle cx="207.8" cy="120" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-0.33s" repeatCount="indefinite"/></circle>
      <circle cx="-155.8" cy="90" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-3.00s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-120" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-1.67s" repeatCount="indefinite"/></circle>
      <circle cx="-207.8" cy="-120" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-2.33s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="240" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-3.67s" repeatCount="indefinite"/></circle>
      <circle cx="51.9" cy="-30" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-1.00s" repeatCount="indefinite"/></circle>
      <circle cx="155.8" cy="90" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-0.33s" repeatCount="indefinite"/></circle>
      <circle cx="103.9" cy="-180" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-1.33s" repeatCount="indefinite"/></circle>
      <circle cx="-80" cy="30" r="12" vector-effect="non-scaling-stroke"><animate attributeName="opacity" values="1;0.15;0.15" keyTimes="0;0.7;1" dur="4.0s" begin="-2.90s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- DROP SHADOW -->
  <ellipse cx="400" cy="550" rx="90" ry="30" fill="rgba(80, 0, 0, 0.45)" filter="url(#shadowBlur)"><animate attributeName="rx" values="90;70;90" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/><animate attributeName="ry" values="30;23;30" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.6;1" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/></ellipse>

  <!-- BLOOD DROP -->
  <g id="blood-drop">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/>
    <!-- Main Drop Body -->
    <path 
      d="M 400 90 
         C 430 220 550 290 550 400 
         A 150 150 0 0 1 250 400 
         C 250 290 370 220 400 90 Z" 
      fill="url(#dropGrad)" 
    />
    
    <!-- Inner Glass/Lighting Reflection (Left side) -->
    <path 
      d="M 400 120 
         C 375 230 270 310 270 400 
         A 130 130 0 0 0 310 490 
         A 110 110 0 0 1 285 400 
         C 285 310 385 230 400 120 Z" 
      fill="rgba(255, 255, 255, 0.35)" 
    />

    <!-- Ambient / Rim Light Reflection (Bottom Right) -->
    <path 
      d="M 500 490 
         A 130 130 0 0 0 545 400 
         C 545 440 510 480 470 500 Z" 
      fill="rgba(255, 120, 120, 0.4)" 
      filter="url(#rimBlur)"
    />
  </g>

</svg>
