services:
  pulse-app:
    image: ghcr.io/43uniprojects/pulse:latest
    container_name: pulse-app-container
    env_file:
      - .env.local
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 650m
    memswap_limit: 1400m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
