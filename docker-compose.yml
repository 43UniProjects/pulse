services:
  pulse-app:
    image: pulse:latest
    build: .
    container_name: pulse-app-container
    env_file:
      - .env.local
    environment:
      - NEXT_TELEMETRY_DISABLED
    secrets:
      - db_username
      - db_password
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mongo:latest
    container_name: database-container
    command: ["--quiet"]
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME_FILE=/run/secrets/db_username
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_username
      - db_password
    volumes:
      - db_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db_data:

secrets:
  db_username:
    file: .secrets/db_username.txt
  db_password:
    file: .secrets/db_password.txt