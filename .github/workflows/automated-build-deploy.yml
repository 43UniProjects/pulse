name: Automated build and deploy production web app

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run type checks
        run: bun run typecheck

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            COMPOSE_FILE="docker-compose.prod.yml"
            CONTAINER_NAME="pulse-app-container"
            IMAGE_REPO="ghcr.io/43uniprojects/pulse"

            cd /home/ubuntu/pulse
            git pull origin main

            # Record and tag the currently running image for instant local rollback
            PREV_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)
            if [ -n "$PREV_IMAGE_ID" ]; then
              echo "Tagging current image ($PREV_IMAGE_ID) as rollback fallback..."
              docker tag "$PREV_IMAGE_ID" "${IMAGE_REPO}:rollback"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Pulling new image ${IMAGE_REPO}:${IMAGE_TAG}..."
            IMAGE_TAG="$IMAGE_TAG" docker compose -f "$COMPOSE_FILE" pull pulse-app

            echo "Starting new container with tag ${IMAGE_TAG}..."
            set +e
            IMAGE_TAG="$IMAGE_TAG" docker compose -f "$COMPOSE_FILE" up -d --no-build --remove-orphans
            UP_EXIT=$?
            set -e

            HEALTHY="false"
            if [ "$UP_EXIT" -eq 0 ]; then
              echo "Waiting for container health check..."
              for i in $(seq 1 20); do
                STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")
                HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_NAME" 2>/dev/null || echo "none")
                RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$CONTAINER_NAME" 2>/dev/null || echo "0")

                echo "Attempt $i/20: status=$STATUS health=$HEALTH restarts=$RESTARTS"

                if [ "$STATUS" = "running" ] && [ "$HEALTH" = "healthy" ]; then
                  HEALTHY="true"
                  break
                fi

                if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$HEALTH" = "unhealthy" ] || [ "$RESTARTS" -ge 2 ]; then
                  echo "Container crash or unhealthy state detected."
                  break
                fi

                sleep 3
              done
            fi

            if [ "$HEALTHY" != "true" ]; then
              echo "Deployment failed! Recent container logs:"
              docker logs --tail 50 "$CONTAINER_NAME" 2>&1 || true

              if [ -n "$PREV_IMAGE_ID" ]; then
                echo "Rolling back to previous image (${PREV_IMAGE_ID})..."
                IMAGE_TAG="rollback" docker compose -f "$COMPOSE_FILE" up -d --no-build --remove-orphans
                sleep 5
                ROLLBACK_STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "missing")
                echo "Rollback container status: $ROLLBACK_STATUS"
              else
                echo "No previous image found to roll back to."
              fi

              exit 1
            fi

            echo "Deployment verified healthy! Cleaning up old images..."
            docker images "$IMAGE_REPO" --format "{{.Repository}}:{{.Tag}}" \
              | grep -E ':sha-' \
              | grep -v ":${IMAGE_TAG}$" \
              | xargs -r docker rmi || true
            docker image prune -f
            echo "Deployment completed successfully."

  report:
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        id: failure_issue
        if: ${{ needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          result-encoding: string
          script: |
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const testResult = process.env.TEST_RESULT;
            const buildResult = process.env.BUILD_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;

            let title;
            let labels;
            let heading;
            let impact;

            if (deployResult === 'failure') {
              title = `Production deploy failed & rolled back (${shortSha})`;
              labels = ['rollback', 'production'];
              heading = '## ⚠️ Production Deployment Rollback Triggered';
              impact = 'The automated production deployment failed health checks and triggered an automatic rollback to the previous working image (`:rollback`).';
            } else if (buildResult === 'failure') {
              title = `Production Docker build failed (${shortSha})`;
              labels = ['ci', 'build-failure'];
              heading = '## ❌ Production Build Failed';
              impact = 'The Docker image build failed. No broken image was pushed and **production was not touched**.';
            } else {
              title = `Production CI checks failed (${shortSha})`;
              labels = ['ci', 'build-failure'];
              heading = '## ❌ CI Test Gate Failed (Lint / Typecheck)';
              impact = 'Lint or typecheck failed before building. No image was built or pushed and **production was not touched**.';
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels,
              body: [
                heading,
                '',
                impact,
                '',
                '| Stage | Result |',
                '| --- | --- |',
                `| **test** | \`${testResult}\` |`,
                `| **build** | \`${buildResult}\` |`,
                `| **deploy** | \`${deployResult}\` |`,
                '',
                '| Field | Value |',
                '| --- | --- |',
                `| **Commit** | [\`${shortSha}\`](${commitUrl}) (\`${sha}\`) |`,
                `| **Image Tag** | \`sha-${sha}\` |`,
                `| **Author / Actor** | @${context.actor} |`,
                `| **Workflow Run** | [View pipeline logs](${runUrl}) |`,
                '',
                '### Next Steps',
                '1. Inspect the failed stage logs in the workflow run above.',
                '2. Push a fix via PR to `main` to trigger a clean build and deploy.',
              ].join('\n'),
            });

            return issue.html_url;

      - name: Write pipeline summary
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          IMAGE_TAG: sha-${{ github.sha }}
          ISSUE_URL: ${{ steps.failure_issue.outputs.result }}
        run: |
          {
            if [ "$DEPLOY_RESULT" = "success" ]; then
              echo "## ✅ Production Build & Deploy Succeeded"
              echo ""
              echo "Production is running \`${IMAGE_TAG}\` and passed health checks."
            elif [ "$DEPLOY_RESULT" = "failure" ]; then
              echo "## ⚠️ Deploy Failed — Rollback Triggered for \`${IMAGE_TAG}\`"
              echo ""
              echo "The new container failed health checks and production was reverted to \`:rollback\`."
            elif [ "$BUILD_RESULT" = "failure" ]; then
              echo "## ❌ Build Failed — Production Untouched"
              echo ""
              echo "Docker build failed before pushing \`${IMAGE_TAG}\`. Production was not modified."
            elif [ "$TEST_RESULT" = "failure" ]; then
              echo "## ❌ Test Gate Failed — Production Untouched"
              echo ""
              echo "Lint or typecheck failed before building. Production was not modified."
            else
              echo "## ⏹️ Pipeline Did Not Complete"
              echo ""
              echo "One or more jobs were cancelled or skipped."
            fi

            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| **test** | \`${TEST_RESULT}\` |"
            echo "| **build** | \`${BUILD_RESULT}\` |"
            echo "| **deploy** | \`${DEPLOY_RESULT}\` |"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| **Image Tag** | \`${IMAGE_TAG}\` |"
            echo "| **Triggered By** | @${GITHUB_ACTOR} |"
            if [ -n "$ISSUE_URL" ]; then
              echo "| **Tracking Issue** | [View Failure Issue](${ISSUE_URL}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"